name: CI

on:
  push:
    branches: [ '**' ]      # every branch, so stacked pull requests carry a green check before they retarget to main
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        node-version: [ 18.x, 20.x, 22.x ]
        # macOS arm64 runners are scarce; one macOS job keeps the platform covered without
        # three jobs waiting on runner acquisition (observed: 15-minute "not acquired" failures).
        include:
          - os: macos-latest
            node-version: 22.x

    steps:
    - uses: actions/checkout@v5
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run build
    - run: npm test

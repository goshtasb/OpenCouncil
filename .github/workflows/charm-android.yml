name: charm-android

on:
  push:
    paths: ["charm-android/**", ".github/workflows/charm-android.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: charm-android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # GitHub's Ubuntu runners ship the Android SDK (ANDROID_HOME); no setup action needed.
      - run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v5
        with:
          name: charm-apk
          path: charm-android/app/build/outputs/apk/release/*.apk

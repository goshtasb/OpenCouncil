# Backlog & Autonomous Execution
backlog:
  wip_limit: 1                      # Max backlog items in council/approval/execution at once
  auto_merge_dev: false              # Enable GitHub auto-merge (squash) on the PR; GitHub merges once required checks pass

# Office Web Dashboard
office:
  port: 4321
  auto_open: false                   # Open the dashboard in the browser when `councilmen office` starts

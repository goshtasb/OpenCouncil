# Open Councilmen Project Configuration
version: 1

# Project Settings
project:
  name: "Open Councilmen"
  base_branch: "main"               # Branch the pull request targets (e.g. main, dev)
  package_manager: "npm"            # Informational: npm, pnpm, yarn, poetry, cargo, go
  install_command: "npm ci"    # Run (via shell) in the execution clone before the Chief Engineer starts
  test_command: "npm test"          # Default test gate (see `verification` to add more gates)
  lint_command: ""                  # Optional default lint gate (e.g. "npm run lint")

# Council Configuration
council:
  max_rounds: 6                     # Rounds before the session stops as STALLED (never presented to the Operator)
  tiebreak_round: 4                 # From this round on, every non-converged round is arbitrated
  round_timeout_seconds: 900        # Per-call timeout for deliberation, tie-break and review (15 mins)
  execution_timeout_seconds: 3600   # Timeout per autonomous execution run (1 hour)
  execution_attempts: 3             # Chief Engineer runs per execution (resumes after Architect rulings or failed verification)

# Council Seats & Model Providers
# Providers: claude-code, grok-cli, antigravity (agy), gemini-cli, ollama
# Run `councilmen doctor` to verify every seat answers before opening a session.
seats:
  lead_pm:
    provider: "antigravity"
    model: "gemini-3.1-pro-high"    # `agy models` lists valid ids
    persona: ".councilmen/personas/lead-pm.md"

  chief_engineer:
    provider: "claude-code"
    model: "opus"                   # Claude Code alias; any id accepted by `claude --model`
    persona: ".councilmen/personas/chief-engineer.md"

  chief_architect:
    provider: "grok-cli"
    model: "grok-4.6"               # `grok models` lists valid ids
    persona: ".councilmen/personas/chief-architect.md"

# Harness Verification Gates
# Run in the execution clone after the Chief Engineer reports DONE and before anything is pushed.
# Every required gate must exit 0; results are recorded per session and summarized in the pull request.
# Leave `gates` unset to use the project lint_command/test_command above. Defining gates replaces them,
# so include your lint and test commands explicitly. Gates make the standards machine-enforced rather
# than advisory — add the ones your stack supports:
verification:
  fail_fast: false
  gates:
    - name: "build"
      command: "npm run build"
      standard: "02 Coding Practices"
    - name: "test"
      command: "npm test"
      standard: "12-point #4 Testing & Release Engineering"                  # false: run every gate and report all failures to the Chief Engineer
